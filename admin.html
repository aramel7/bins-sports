<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 | 빈스 스포츠 마케팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .gold-bg { background: linear-gradient(135deg, #a07d10, #c9a227, #e6c458); }
    .admin-tab { padding: 8px 18px; border-radius: 9999px; font-size: 14px; font-weight: 700; }
    .admin-tab.active { background: #111827; color: white; }
  </style>
</head>
<body class="bg-gray-100">

  <!-- 로그인 -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
    <div class="bg-white rounded-3xl p-10 shadow-xl max-w-sm w-full">
      <div class="text-center mb-6">
        <img src="logo.png" alt="빈스" style="height:44px;width:auto;display:inline-block;background:#f2f0ec;border-radius:8px;padding:5px 14px;" />
      </div>
      <h1 class="text-2xl font-black text-center mb-1">관리자 로그인</h1>
      <p class="text-center text-gray-400 text-sm mb-6">빈스 스포츠 마케팅 · 빈스몰 관리</p>
      <input id="pw-input" type="password" placeholder="관리자 비밀번호" 
             class="w-full border-2 border-gray-200 rounded-xl px-4 py-3 mb-3 text-center text-lg focus:border-yellow-500" 
             onkeydown="if(event.key==='Enter')doLogin()">
      <div id="login-error" class="hidden text-red-500 text-sm text-center mb-3">비밀번호가 틀렸습니다.</div>
      <button onclick="doLogin()" class="w-full gold-bg text-white font-black py-3.5 rounded-2xl text-lg">로그인</button>
      <p class="text-center text-xs text-gray-400 mt-4">기본 비밀번호: bins2026!</p>
    </div>
  </div>

  <!-- 관리자 화면 -->
  <div id="admin-screen" class="hidden">
    <header class="bg-white border-b px-5 py-4 flex items-center justify-between sticky top-0 z-10">
      <div class="flex items-center gap-3">
        <img src="logo.png" alt="" style="height:34px;background:#f2f0ec;border-radius:6px;padding:3px 10px;" />
        <span class="font-black text-xl">관리자</span>
      </div>
      <div class="flex items-center gap-3 text-sm">
        <button onclick="logout()" class="text-gray-500 hover:text-gray-900 px-3 py-1">로그아웃</button>
      </div>
    </header>

    <!-- 탭 -->
    <div class="max-w-7xl mx-auto px-4 pt-6">
      <div class="flex gap-2 mb-5 flex-wrap">
        <button onclick="switchTab(0)" class="admin-tab active" id="tab-0">신청 관리</button>
        <button onclick="switchTab(1)" class="admin-tab bg-white border border-gray-200" id="tab-1">빈스몰 상품 관리</button>
        <button onclick="switchTab(2)" class="admin-tab bg-white border border-gray-200" id="tab-2">회원 · 포인트 관리</button>
      </div>
    </div>

    <!-- ===== 탭 0: 기존 신청 관리 ===== -->
    <div id="tab-content-0" class="max-w-7xl mx-auto px-4 pb-10">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-5 rounded-2xl border"><div class="text-gray-400 text-sm">전체 신청</div><div id="stat-total" class="text-3xl font-black">0</div></div>
        <div class="bg-white p-5 rounded-2xl border"><div class="text-gray-400 text-sm">기업행사</div><div id="stat-lesson" class="text-3xl font-black text-green-700">0</div></div>
        <div class="bg-white p-5 rounded-2xl border"><div class="text-gray-400 text-sm">1박2일 패키지</div><div id="stat-pkg" class="text-3xl font-black text-amber-700">0</div></div>
        <div class="bg-white p-5 rounded-2xl border"><div class="text-gray-400 text-sm">전지훈련</div><div id="stat-camp" class="text-3xl font-black text-blue-700">0</div></div>
      </div>

      <div class="flex gap-2 mb-4 flex-wrap">
        <button onclick="filterBy('전체')" class="filter-btn active bg-gray-900 text-white px-4 py-1.5 text-sm rounded-full">전체</button>
        <button onclick="filterBy('기업행사')" class="filter-btn bg-white border px-4 py-1.5 text-sm rounded-full">기업행사</button>
        <button onclick="filterBy('1박2일패키지')" class="filter-btn bg-white border px-4 py-1.5 text-sm rounded-full">1박2일패키지</button>
        <button onclick="filterBy('전지훈련')" class="filter-btn bg-white border px-4 py-1.5 text-sm rounded-full">전지훈련</button>
        <button onclick="filterBy('신규')" class="filter-btn bg-red-50 border border-red-200 text-red-600 px-4 py-1.5 text-sm rounded-full">신규만</button>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50"><tr>
              <th class="px-5 py-3 text-left text-xs font-bold text-gray-500">신청일시</th>
              <th class="px-5 py-3 text-left text-xs font-bold text-gray-500">종류</th>
              <th class="px-5 py-3 text-left text-xs font-bold text-gray-500">이름</th>
              <th class="px-5 py-3 text-left text-xs font-bold text-gray-500">연락처</th>
              <th class="px-5 py-3 text-left text-xs font-bold text-gray-500">상태</th>
              <th class="px-5 py-3 text-left text-xs font-bold text-gray-500">관리</th>
            </tr></thead>
            <tbody id="apps-body"></tbody>
          </table>
        </div>
      </div>
      <p class="text-xs text-center text-gray-400 mt-4">데이터는 이 브라우저에 저장됩니다.</p>
    </div>

    <!-- ===== 탭 1: 빈스몰 상품 관리 ===== -->
    <div id="tab-content-1" class="max-w-7xl mx-auto px-4 pb-10 hidden">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-xl font-black">빈스몰 상품 관리</h2>
        <button onclick="showAddProductModal()" class="gold-bg text-white px-5 py-2 rounded-2xl text-sm font-bold">+ 상품 추가</button>
      </div>

      <div class="bg-white rounded-2xl border overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-5 py-3 text-left">상품명</th>
              <th class="px-5 py-3 text-left">설명</th>
              <th class="px-5 py-3 text-right">필요 포인트</th>
              <th class="px-5 py-3 text-center w-32">관리</th>
            </tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
      </div>
    </div>

    <!-- ===== 탭 2: 회원 · 포인트 관리 ===== -->
    <div id="tab-content-2" class="max-w-7xl mx-auto px-4 pb-10 hidden">
      <h2 class="text-xl font-black mb-5">회원 관리 및 포인트 부여</h2>

      <div class="bg-white rounded-2xl border overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-5 py-3 text-left">아이디</th>
              <th class="px-5 py-3 text-left">실명</th>
              <th class="px-5 py-3 text-left">전화번호</th>
              <th class="px-5 py-3 text-right">보유 포인트</th>
              <th class="px-5 py-3 text-center">인증</th>
              <th class="px-5 py-3 text-center w-56">포인트 부여 / 관리</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>
      <p class="text-xs text-gray-400 mt-3">※ 실명인증은 관리자가 직접 확인 후 처리하세요.</p>
    </div>
  </div>

  <!-- 상품 추가/수정 모달 -->
  <div id="product-modal" onclick="if(event.target.id==='product-modal') hideProductModal()" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div onclick="event.stopImmediatePropagation()" class="bg-white w-full max-w-md rounded-3xl p-6">
      <h3 class="font-black text-xl mb-4" id="product-modal-title">상품 추가</h3>
      <input type="hidden" id="product-id">
      <div class="space-y-3">
        <input id="product-name" type="text" placeholder="상품명" class="w-full border rounded-xl px-4 py-2.5">
        <input id="product-desc" type="text" placeholder="설명" class="w-full border rounded-xl px-4 py-2.5">
        <div class="flex gap-3">
          <div class="flex-1">
            <div class="text-xs text-gray-500 mb-1">필요 포인트</div>
            <input id="product-points" type="number" value="500" class="w-full border rounded-xl px-4 py-2.5">
          </div>
          <div class="flex-1">
            <div class="text-xs text-gray-500 mb-1">이모지 아이콘</div>
            <input id="product-image" type="text" value="🏌️" class="w-full border rounded-xl px-4 py-2.5">
          </div>
        </div>
      </div>
      <div class="flex gap-2 mt-5">
        <button onclick="hideProductModal()" class="flex-1 py-3 border rounded-2xl">취소</button>
        <button onclick="saveProductFromModal()" class="flex-1 py-3 gold-bg text-white font-bold rounded-2xl">저장</button>
      </div>
    </div>
  </div>

  <script src="bins-mall.js"></script>
  <script>
    // 기존 신청 관리 로직 (간소화 버전)
    const ADMIN_PW = 'bins2026!';
    let currentFilter = '전체';

    function doLogin() {
      const pw = document.getElementById('pw-input').value;
      if (pw === ADMIN_PW) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
        switchTab(0);
      } else {
        document.getElementById('login-error').classList.remove('hidden');
        document.getElementById('pw-input').value = '';
      }
    }

    function logout() {
      document.getElementById('admin-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('pw-input').value = '';
    }

    // 탭 전환
    function switchTab(tab) {
      document.querySelectorAll('[id^="tab-content-"]').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-content-' + tab).classList.remove('hidden');

      document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('active', 'bg-gray-900', 'text-white'));
      document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('bg-white', 'border', 'border-gray-200'));

      const activeBtn = document.getElementById('tab-' + tab);
      activeBtn.classList.add('active', 'bg-gray-900', 'text-white');
      activeBtn.classList.remove('bg-white', 'border', 'border-gray-200');

      if (tab === 0) renderDashboard();
      if (tab === 1) renderProductsAdmin();
      if (tab === 2) renderUsersAdmin();
    }

    // ===== 기존 신청관리 =====
    function getApps() {
      try { return JSON.parse(localStorage.getItem('bins_applications') || '[]'); } catch { return []; }
    }
    function saveApps(apps) { localStorage.setItem('bins_applications', JSON.stringify(apps)); }

    function renderDashboard() {
      const apps = getApps();
      document.getElementById('stat-total').textContent = apps.length;
      document.getElementById('stat-lesson').textContent = apps.filter(a => a.type === '기업행사').length;
      document.getElementById('stat-pkg').textContent = apps.filter(a => a.type === '1박2일패키지').length;
      document.getElementById('stat-camp').textContent = apps.filter(a => a.type === '전지훈련').length;
      renderAppsTable();
    }

    function filterBy(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('bg-gray-900','text-white'));
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.add('bg-white','border'));
      event.target.classList.add('bg-gray-900','text-white');
      event.target.classList.remove('bg-white','border');
      renderAppsTable();
    }

    function renderAppsTable() {
      const apps = getApps().slice().reverse();
      let filtered = apps;
      if (currentFilter === '신규') filtered = apps.filter(a => a.status === '신규');
      else if (currentFilter !== '전체') filtered = apps.filter(a => a.type === currentFilter);

      const tbody = document.getElementById('apps-body');
      tbody.innerHTML = filtered.map(a => `
        <tr class="border-b">
          <td class="px-5 py-3 text-xs">${new Date(a.submittedAt).toLocaleString('ko-KR')}</td>
          <td class="px-5 py-3">${a.type}</td>
          <td class="px-5 py-3 font-bold">${a.name||''}</td>
          <td class="px-5 py-3">${a.phone||''}</td>
          <td class="px-5 py-3">${a.status}</td>
          <td class="px-5 py-3">
            ${a.status==='신규' ? `<button onclick="markDone('${a.id}')" class="text-xs bg-green-600 text-white px-3 py-1 rounded">확인</button>` : ''}
            <button onclick="deleteApp('${a.id}')" class="text-xs bg-red-50 text-red-600 px-3 py-1 rounded ml-1">삭제</button>
          </td>
        </tr>`).join('');
    }

    function markDone(id) {
      const apps = getApps();
      const idx = apps.findIndex(x => x.id === id);
      if (idx > -1) { apps[idx].status = '확인완료'; saveApps(apps); renderDashboard(); }
    }
    function deleteApp(id) {
      if (!confirm('삭제할까요?')) return;
      const apps = getApps().filter(x => x.id !== id);
      saveApps(apps);
      renderDashboard();
    }

    // ===== 상품 관리 (관리자) =====
    function renderProductsAdmin() {
      const products = getProducts();
      const tbody = document.getElementById('products-body');
      tbody.innerHTML = products.map(p => `
        <tr class="border-b">
          <td class="px-5 py-3 font-bold">${p.name}</td>
          <td class="px-5 py-3 text-sm text-gray-600">${p.desc}</td>
          <td class="px-5 py-3 text-right font-bold text-yellow-600">${p.points} P</td>
          <td class="px-5 py-3 text-center">
            <button onclick="editProduct('${p.id}')" class="text-xs px-3 py-1 border rounded mr-1">수정</button>
            <button onclick="deleteProductAdmin('${p.id}')" class="text-xs px-3 py-1 bg-red-50 text-red-600 rounded">삭제</button>
          </td>
        </tr>
      `).join('');
    }

    let editingProductId = null;

    function showAddProductModal() {
      editingProductId = null;
      document.getElementById('product-modal-title').textContent = '상품 추가';
      document.getElementById('product-id').value = '';
      document.getElementById('product-name').value = '';
      document.getElementById('product-desc').value = '';
      document.getElementById('product-points').value = '500';
      document.getElementById('product-image').value = '🏌️';
      document.getElementById('product-modal').classList.remove('hidden');
      document.getElementById('product-modal').classList.add('flex');
    }

    function editProduct(id) {
      const product = getProducts().find(p => p.id === id);
      if (!product) return;
      editingProductId = id;
      document.getElementById('product-modal-title').textContent = '상품 수정';
      document.getElementById('product-id').value = id;
      document.getElementById('product-name').value = product.name;
      document.getElementById('product-desc').value = product.desc;
      document.getElementById('product-points').value = product.points;
      document.getElementById('product-image').value = product.image || '🏌️';
      document.getElementById('product-modal').classList.remove('hidden');
      document.getElementById('product-modal').classList.add('flex');
    }

    function hideProductModal() {
      document.getElementById('product-modal').classList.remove('flex');
      document.getElementById('product-modal').classList.add('hidden');
    }

    function saveProductFromModal() {
      const id = document.getElementById('product-id').value;
      const name = document.getElementById('product-name').value.trim();
      const desc = document.getElementById('product-desc').value.trim();
      const points = parseInt(document.getElementById('product-points').value) || 0;
      const image = document.getElementById('product-image').value.trim();

      if (!name || !points) { alert('상품명과 포인트를 입력하세요'); return; }

      let products = getProducts();
      if (id) {
        const idx = products.findIndex(p => p.id === id);
        if (idx > -1) products[idx] = { ...products[idx], name, desc, points, image };
      } else {
        products.push({ id: 'p' + Date.now(), name, desc, points, image });
      }
      saveProducts(products);
      hideProductModal();
      renderProductsAdmin();
    }

    function deleteProductAdmin(id) {
      if (!confirm('상품을 삭제할까요?')) return;
      let products = getProducts().filter(p => p.id !== id);
      saveProducts(products);
      renderProductsAdmin();
    }

    // ===== 회원 · 포인트 관리 =====
    function renderUsersAdmin() {
      const users = getUsers();
      const tbody = document.getElementById('users-body');
      tbody.innerHTML = users.map(u => `
        <tr class="border-b hover:bg-gray-50">
          <td class="px-5 py-3 font-mono text-sm">${u.username}</td>
          <td class="px-5 py-3 font-bold">${u.name}</td>
          <td class="px-5 py-3">${u.phone}</td>
          <td class="px-5 py-3 text-right font-black text-yellow-600">${u.points || 0} P</td>
          <td class="px-5 py-3 text-center">
            <button onclick="toggleVerify('${u.id}', ${!u.verified})" 
                    class="text-xs px-3 py-1 rounded-full ${u.verified ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-600'}">
              ${u.verified ? '인증됨' : '미인증'}
            </button>
          </td>
          <td class="px-5 py-3">
            <div class="flex gap-1 items-center justify-center">
              <input type="number" id="add-points-${u.id}" value="100" class="w-16 border text-center rounded px-2 py-1 text-sm">
              <button onclick="givePoints('${u.id}')" class="px-3 py-1 bg-yellow-500 text-white rounded text-xs font-bold">부여</button>
              <button onclick="resetUserPoints('${u.id}')" class="px-3 py-1 bg-gray-200 text-xs rounded">초기화</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function toggleVerify(userId, newVerified) {
      setUserVerified(userId, newVerified);
      renderUsersAdmin();
    }

    function givePoints(userId) {
      const input = document.getElementById('add-points-' + userId);
      const amount = parseInt(input.value) || 0;
      if (amount <= 0) return;
      addPointsToUser(userId, amount);
      renderUsersAdmin();
    }

    function resetUserPoints(userId) {
      if (!confirm('포인트를 0으로 초기화할까요?')) return;
      const users = getUsers();
      const idx = users.findIndex(u => u.id === userId);
      if (idx > -1) {
        users[idx].points = 0;
        saveUsers(users);
      }
      renderUsersAdmin();
    }

    // 초기화
    function initAdmin() {
      // 기존 앱 데이터 초기화 필요 시
      // 기본 시드 데이터는 bins-mall.js 에서 처리
    }
    initAdmin();
  </script>
</body>
</html>
